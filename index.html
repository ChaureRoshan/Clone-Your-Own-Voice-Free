
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI Voice Clone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111b;color:white;font-family:Arial;padding:16px}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#858bff}
.card{background:#1c1e30;padding:17px;border-radius:14px;margin:15px 0}
input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#292b40;color:white;border:1px solid #555;border-radius:8px}
textarea{min-height:130px}
button{width:100%;padding:14px;margin:8px 0;background:#686fff;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
#recordBtn.recording{background:#d94b65}
#status,#voiceStatus,#recordStatus{white-space:pre-wrap;line-height:1.5}
#status,#voiceStatus{color:#aab0ff}
audio{width:100%;margin-top:12px}
small{color:#bbb;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>🎙️ My AI Voice Clone</h1>

<div class="card">
<h3>1. Upload Your Video</h3>
<input type="file" id="videoFile" accept="video/*">

<label>व्हिडिओमधील आवाजाची भाषा</label>
<select id="sourceLang">
<option value="hi-IN">Hindi</option>
<option value="mr-IN">Marathi</option>
</select>

<button id="createBtn">Extract Voice & Save My Voice</button>

<hr>
<h3>Choose Audio File</h3>
<input type="file" id="audioFile" accept="audio/*">
<button id="audioBtn">Choose Audio & Save My Voice</button>

<hr>
<h3>Record Your Own Voice</h3>
<button id="recordBtn">🎤 Start Recording</button>
<p id="recordStatus">स्वतःचा आवाज रेकॉर्ड करण्यासाठी बटण दाबा.</p>

<p id="voiceStatus">व्हिडिओ, ऑडिओ किंवा रेकॉर्डिंग निवडा.</p>
<audio id="referencePlayer" controls hidden></audio>
</div>

<div class="card">
<h3>2. Text to Voice</h3>
<label>भाषा निवडा</label>
<select id="outputLang">
<option value="hi-IN">Hindi</option>
<option value="mr-IN">Marathi</option>
</select>

<textarea id="textInput" maxlength="1000"
placeholder="इथे तुमचा मजकूर लिहा..."></textarea>

<button id="generateBtn">Generate Same Voice</button>

<audio id="resultAudio" controls hidden></audio>
<button id="downloadBtn" hidden>Download MP3</button>
</div>

<p id="status">Ready</p>
<small>फक्त स्वतःचा किंवा स्पष्ट परवानगी असलेला आवाज वापरा. API वापराचे शुल्क लागू शकते.</small>
</div>

<script>
const API_BASE = "https://my-ai-voice-clone.onrender.com";

const videoFile = document.getElementById("videoFile");
const audioFile = document.getElementById("audioFile");
const createBtn = document.getElementById("createBtn");
const audioBtn = document.getElementById("audioBtn");
const recordBtn = document.getElementById("recordBtn");
const generateBtn = document.getElementById("generateBtn");
const voiceStatus = document.getElementById("voiceStatus");
const statusBox = document.getElementById("status");
const recordStatus = document.getElementById("recordStatus");
const referencePlayer = document.getElementById("referencePlayer");
const resultAudio = document.getElementById("resultAudio");
const downloadBtn = document.getElementById("downloadBtn");

let voiceId = localStorage.getItem("mySavedVoiceId") || "";
let resultUrl = "";
let referenceUrl = "";
let mediaRecorder = null;
let recordedChunks = [];
let recordingStream = null;
let busy = false;

/* Error चा खरा मेसेज दाखवणे */
function readableError(error) {
  if (error === null || error === undefined) {
    return "अज्ञात Error";
  }

  if (typeof error === "string") {
    return error;
  }

  if (error.message && typeof error.message === "string") {
    return error.message;
  }

  if (error.error) {
    return readableError(error.error);
  }

  try {
    return JSON.stringify(error);
  } catch (_) {
    return String(error);
  }
}

function setStatus(message) {
  statusBox.textContent = message;
}

function setBusy(value) {
  busy = value;
  createBtn.disabled = value;
  audioBtn.disabled = value;
  generateBtn.disabled = value || !voiceId;
  recordBtn.disabled = value;
}

function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);

  function writeString(offset, text) {
    for (let i = 0; i < text.length; i++) {
      view.setUint8(offset + i, text.charCodeAt(i));
    }
  }

  writeString(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);

  writeString(36, "data");
  view.setUint32(40, samples.length * 2, true);

  let offset = 44;

  for (let i = 0; i < samples.length; i++) {
    const sample = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(
      offset,
      sample < 0 ? sample * 32768 : sample * 32767,
      true
    );
    offset += 2;
  }

  return new Blob([buffer], {type:"audio/wav"});
}

/* Video किंवा Audio मधून आवाज काढणे */
async function extractReferenceAudio(file) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;

  if (!AudioCtx) {
    throw new Error("तुझ्या Browser मध्ये Audio support उपलब्ध नाही.");
  }

  const context = new AudioCtx();

  try {
    const decoded = await context.decodeAudioData(
      await file.arrayBuffer()
    );

    const duration = Math.min(15, decoded.duration);
    const length = Math.floor(duration * decoded.sampleRate);
    const mono = new Float32Array(length);

    for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
      const data = decoded.getChannelData(channel);

      for (let i = 0; i < length; i++) {
        mono[i] += data[i] / decoded.numberOfChannels;
      }
    }

    let peak = 0;

    for (const sample of mono) {
      peak = Math.max(peak, Math.abs(sample));
    }

    if (peak <= 0.0001) {
      throw new Error("फाईलमध्ये आवाज सापडला नाही.");
    }

    const gain = Math.min(0.95 / peak, 5);

    for (let i = 0; i < mono.length; i++) {
      mono[i] *= gain;
    }

    return encodeWav(mono, decoded.sampleRate);

  } finally {
    await context.close();
  }
}

/* काढलेला किंवा रेकॉर्ड केलेला आवाज सेव्ह करणे */
async function saveMyVoice(wav) {
  setBusy(true);

  try {
    if (referenceUrl) URL.revokeObjectURL(referenceUrl);

    referenceUrl = URL.createObjectURL(wav);
    referencePlayer.src = referenceUrl;
    referencePlayer.hidden = false;

    const form = new FormData();
    form.append("file", wav, "reference.wav");
    form.append("name", "My Personal Voice");
    form.append("language", document.getElementById("sourceLang").value);

    voiceStatus.textContent = "AI मध्ये Voice Save होत आहे...";

    const response = await fetch(API_BASE + "/api/voice/create", {
      method: "POST",
      body: form
    });

    let data = {};

    try {
      data = await response.json();
    } catch (_) {
      throw new Error("Server कडून योग्य Response मिळाला नाही.");
    }

    if (!response.ok) {
      throw new Error(readableError(data.error || data));
    }

    const newVoiceId =
      data.voice_id ||
      data.data?.voice_id ||
      data.id ||
      data.data?.id;

    if (!newVoiceId) {
      throw new Error(
        "API कडून Voice ID मिळाली नाही. Server Response: " +
        readableError(data)
      );
    }

    voiceId = newVoiceId;
    localStorage.setItem("mySavedVoiceId", voiceId);

    voiceStatus.textContent = "✅ तुझा Voice Save झाला!";
    setStatus("आता Text टाकून Generate Same Voice दाब.");

  } catch (error) {
    const message = readableError(error);
    voiceStatus.textContent = "Error: " + message;
    setStatus("Voice Save झाला नाही: " + message);
    console.error("Save Voice Error:", error);

  } finally {
    setBusy(false);
  }
}

/* Video मधून Voice Save */
createBtn.onclick = async () => {
  const file = videoFile.files[0];

  if (!file) {
    alert("आधी Video निवडा.");
    return;
  }

  try {
    setBusy(true);
    voiceStatus.textContent = "व्हिडिओमधून 15 सेकंदांचा आवाज काढत आहे...";
    const wav = await extractReferenceAudio(file);
    await saveMyVoice(wav);

  } catch (error) {
    const message = readableError(error);
    voiceStatus.textContent = "Error: " + message;
    setStatus("Video मधून आवाज काढता आला नाही: " + message);
    setBusy(false);
  }
};

/* Audio File मधून Voice Save */
audioBtn.onclick = async () => {
  const file = audioFile.files[0];

  if (!file) {
    alert("आधी Audio File निवडा.");
    return;
  }

  try {
    setBusy(true);
    voiceStatus.textContent = "Audio मधून 15 सेकंदांचा आवाज काढत आहे...";
    const wav = await extractReferenceAudio(file);
    await saveMyVoice(wav);

  } catch (error) {
    const message = readableError(error);
    voiceStatus.textContent = "Error: " + message;
    setStatus("Audio मधून आवाज काढता आला नाही: " + message);
    setBusy(false);
  }
};

/* स्वतःचा आवाज Record करणे */
recordBtn.onclick = async () => {

  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    recordBtn.textContent = "🎤 Start Recording";
    recordBtn.classList.remove("recording");
    recordStatus.textContent = "Recording थांबवली. Audio तयार होत आहे...";
    return;
  }

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Microphone साठी HTTPS Browser वापरा.");
    }

    recordingStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    recordedChunks = [];

    let options = {};

    if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
      options.mimeType = "audio/webm;codecs=opus";
    } else if (MediaRecorder.isTypeSupported("audio/webm")) {
      options.mimeType = "audio/webm";
    }

    mediaRecorder = new MediaRecorder(recordingStream, options);

    mediaRecorder.ondataavailable = (event) => {
      if (event.data && event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    mediaRecorder.onerror = (event) => {
      console.error("MediaRecorder Error:", event);
      recordStatus.textContent = "Recording मध्ये Error आला.";
    };

    mediaRecorder.onstop = async () => {
      if (recordingStream) {
        recordingStream.getTracks().forEach(track => track.stop());
        recordingStream = null;
      }

      try {
        const recordedBlob = new Blob(recordedChunks, {
          type: mediaRecorder.mimeType || "audio/webm"
        });

        if (!recordedBlob.size) {
          throw new Error("Recording रिकामी आहे.");
        }

        recordStatus.textContent = "Recording मधून आवाज काढत आहे...";

        const wav = await extractReferenceAudio(recordedBlob);
        await saveMyVoice(wav);

        recordStatus.textContent = "✅ Recording पूर्ण झाली.";

      } catch (error) {
        const message = readableError(error);
        recordStatus.textContent = "Error: " + message;
        voiceStatus.textContent = "Recording Error: " + message;
        setStatus("Recording Save झाली नाही: " + message);
        console.error("Recording Error:", error);
      }
    };

    mediaRecorder.start();

    recordBtn.textContent = "⏹ Stop Recording";
    recordBtn.classList.add("recording");
    recordStatus.textContent = "🔴 Recording सुरू आहे. पूर्ण झाल्यावर Stop दाबा.";

  } catch (error) {
    const message = readableError(error);
    recordStatus.textContent = "Microphone Error: " + message;
    setStatus("Microphone Error: " + message);
    alert("Microphone Permission द्या आणि पुन्हा प्रयत्न करा.");
    console.error("Microphone Error:", error);
  }
};

/* आधी सेव्ह केलेली Voice तपासा */
if (voiceId) {
  voiceStatus.textContent = "✅ आधीची Voice उपलब्ध आहे.";
  setStatus("आता Text टाकून Generate Same Voice दाब.");
  generateBtn.disabled = false;
} else {
  voiceStatus.textContent = "व्हिडिओ, ऑडिओ किंवा रेकॉर्डिंग निवडा.";
  generateBtn.disabled = true;
}

/* Generate Same Voice */
generateBtn.onclick = async () => {
  const text = document.getElementById("textInput").value.trim();

  if (!voiceId) {
    alert("आधी Voice Save कर.");
    return;
  }

  if (!text) {
    alert("आधी Text लिही.");
    return;
  }

  generateBtn.disabled = true;
  setStatus("तुझ्या आवाजात Audio तयार होत आहे...");

  try {
    const response = await fetch(API_BASE + "/api/voice/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        voice_id: voiceId,
        text: text,
        language_code: document.getElementById("outputLang").value
      })
    });

    if (!response.ok) {
      let message = "Audio generation failed.";

      try {
        const err = await response.json();
        message = readableError(err.error || err);
      } catch (_) {}

      throw new Error(message);
    }

    const blob = await response.blob();

    if (!blob.size) {
      throw new Error("Audio रिकामा मिळाला.");
    }

    if (resultUrl) URL.revokeObjectURL(resultUrl);

    resultUrl = URL.createObjectURL(blob);
    resultAudio.src = resultUrl;
    resultAudio.hidden = false;
    downloadBtn.hidden = false;

    setStatus("✅ तुझ्या आवाजात Audio तयार झाला!");

  } catch (error) {
    const message = readableError(error);
    setStatus("Error: " + message);
    console.error("Generate Error:", error);

  } finally {
    generateBtn.disabled = false;
  }
};

/* Download MP3 */
downloadBtn.onclick = () => {
  if (!resultUrl) return;

  const a = document.createElement("a");
  a.href = resultUrl;
  a.download = "my-cloned-voice.mp3";
  a.click();
};
</script>
</body>
</html>
