
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI Voice Clone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111b;color:white;font-family:Arial;padding:16px}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#858bff}
.card{background:#1c1e30;padding:17px;border-radius:14px;margin:15px 0}
input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#292b40;color:white;border:1px solid #555;border-radius:8px}
textarea{min-height:130px}
button{width:100%;padding:14px;margin:8px 0;background:#686fff;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
#status{color:#aab0ff;white-space:pre-wrap;line-height:1.5}
audio{width:100%;margin-top:12px}
small{color:#bbb;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>🎙️ My AI Voice Clone</h1>

<div class="card">
<h3>1. Upload Your Video</h3>
<input type="file" id="videoFile" accept="video/*">

<label>व्हिडिओमधील आवाजाची भाषा</label>
<select id="sourceLang">
<option value="hi-IN">Hindi</option>
<option value="mr-IN">Marathi</option>
</select>

<button id="createBtn">Extract Voice & Save My Voice</button>
<p id="voiceStatus">व्हिडिओ निवडा.</p>
<audio id="referencePlayer" controls hidden></audio>
</div>

<div class="card">
<h3>2. Text to Voice</h3>
<label>भाषा निवडा</label>
<select id="outputLang">
<option value="hi-IN">Hindi</option>
<option value="mr-IN">Marathi</option>
</select>

<textarea id="textInput" maxlength="1000"
placeholder="इथे तुमचा मजकूर लिहा..."></textarea>

<button id="generateBtn" disabled>Generate Same Voice</button>

<audio id="resultAudio" controls hidden></audio>
<button id="downloadBtn" hidden>Download MP3</button>
</div>

<p id="status">Ready</p>
<small>फक्त स्वतःचा किंवा स्पष्ट परवानगी असलेला आवाज वापरा. Voice cloning साठी API वापराचे शुल्क लागू शकते.</small>
</div>

<script>
const API_BASE = "https://my-ai-voice-clone.onrender.com";

const videoFile = document.getElementById("videoFile");
const createBtn = document.getElementById("createBtn");
const generateBtn = document.getElementById("generateBtn");
const voiceStatus = document.getElementById("voiceStatus");
const statusBox = document.getElementById("status");
const referencePlayer = document.getElementById("referencePlayer");
const resultAudio = document.getElementById("resultAudio");
const downloadBtn = document.getElementById("downloadBtn");

let voiceId = "";
let resultUrl = "";

function setStatus(message) {
  statusBox.textContent = message;
}

function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);

  function writeString(offset, text) {
    for (let i = 0; i < text.length; i++) {
      view.setUint8(offset + i, text.charCodeAt(i));
    }
  }

  writeString(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, "data");
  view.setUint32(40, samples.length * 2, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++) {
    const sample = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, sample < 0 ? sample * 32768 : sample * 32767, true);
    offset += 2;
  }

  return new Blob([buffer], {type:"audio/wav"});
}

async function extractReferenceAudio(file) {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const context = new AudioCtx();

  try {
    const decoded = await context.decodeAudioData(await file.arrayBuffer());
    const duration = Math.min(15, decoded.duration);
    const length = Math.floor(duration * decoded.sampleRate);
    const mono = new Float32Array(length);

    for (let channel = 0; channel < decoded.numberOfChannels; channel++) {
      const data = decoded.getChannelData(channel);
      for (let i = 0; i < length; i++) {
        mono[i] += data[i] / decoded.numberOfChannels;
      }
    }

    let peak = 0;
    for (const sample of mono) peak = Math.max(peak, Math.abs(sample));

    if (peak > 0.0001) {
      const gain = Math.min(0.95 / peak, 5);
      for (let i = 0; i < mono.length; i++) mono[i] *= gain;
    }

    return encodeWav(mono, decoded.sampleRate);
  } finally {
    await context.close();
  }
}

createBtn.onclick = async () => {
  const file = videoFile.files[0];

  if (!file) return alert("आधी Video निवडा.");

  createBtn.disabled = true;
  generateBtn.disabled = true;
  voiceStatus.textContent = "व्हिडिओमधून 15 सेकंदांचा आवाज काढत आहे...";

  try {
    const wav = await extractReferenceAudio(file);

    if (wav.size > 50 * 1024 * 1024) {
      throw new Error("Audio file खूप मोठी आहे.");
    }

    referencePlayer.src = URL.createObjectURL(wav);
    referencePlayer.hidden = false;

    const form = new FormData();
    form.append("file", wav, "reference.wav");
    form.append("name", "My Personal Voice");
    form.append("language", document.getElementById("sourceLang").value);

    voiceStatus.textContent = "तुझा Voice AI मध्ये तयार होत आहे...";

    const response = await fetch(API_BASE + "/api/voice/create", {
      method:"POST",
      body:form
    });

    const data = await response.json();

    if (!response.ok) throw new Error(data.error || "Voice create failed.");

    voiceId = data.voice_id;
    generateBtn.disabled = false;
    voiceStatus.textContent = "✅ तुझा Voice Save झाला!";
    setStatus("आता Text टाकून Generate Same Voice दाब.");

  } catch (error) {
    voiceStatus.textContent = "Error: " + error.message;
    setStatus("Voice तयार झाला नाही.");
  } finally {
    createBtn.disabled = false;
  }
};

generateBtn.onclick = async () => {
  const text = document.getElementById("textInput").value.trim();

  if (!voiceId) return alert("आधी Voice Save कर.");
  if (!text) return alert("आधी Text लिही.");
  if (text.length > 1000) return alert("एका वेळी जास्तीत जास्त 1000 अक्षरे.");

  generateBtn.disabled = true;
  setStatus("तुझ्या आवाजात Audio तयार होत आहे...");

  try {
    const response = await fetch(API_BASE + "/api/voice/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        voice_id:voiceId,
        text:text,
        language_code:document.getElementById("outputLang").value
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error || "Audio generation failed.");
    }

    const blob = await response.blob();

    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);

    resultAudio.src = resultUrl;
    resultAudio.hidden = false;
    downloadBtn.hidden = false;

    setStatus("✅ तुझ्या आवाजात Audio तयार झाला!");

  } catch (error) {
    setStatus("Error: " + error.message);
  } finally {
    generateBtn.disabled = false;
  }
};

downloadBtn.onclick = () => {
  if (!resultUrl) return;

  const a = document.createElement("a");
  a.href = resultUrl;
  a.download = "my-cloned-voice.mp3";
  a.click();
};
</script>
</body>
</html>
