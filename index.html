
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video to Hindi Text</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#10111b;color:white;font-family:Arial,sans-serif}
.container{max-width:650px;margin:auto}
h1{text-align:center;color:#858bff}
.card{background:#1c1e30;padding:17px;border-radius:14px;margin:15px 0}
label{display:block;margin:12px 0}
button,.filebtn{display:block;width:100%;padding:13px;margin:10px 0;border:0;border-radius:9px;background:#686fff;color:white;font-size:16px;font-weight:bold}
input[type=file]{width:100%;margin:12px 0}
select,textarea{width:100%;padding:12px;border-radius:8px;background:#292b40;color:white;border:1px solid #555}
textarea{min-height:220px;resize:vertical}
button:disabled{opacity:.5}
#status{color:#aab0ff;white-space:pre-wrap;line-height:1.5}
.small{color:#bbb;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>🎬 Video To Text Converter</h1>

<div class="card">
<h3>1. Video निवडा</h3>
<input type="file" id="video" accept="video/*">

<h3>2. Conversion Mode</h3>
<label>
<input type="radio" name="mode" value="hindi" checked>
 हिंदी Audio → हिंदी Text
</label>
<label>
<input type="radio" name="mode" value="translate">
 English Audio → हिंदी Translation
</label>

<button id="start">Start Conversion</button>
<p id="status">व्हिडिओ निवडा आणि Conversion सुरू करा.</p>
</div>

<div class="card">
<h3>3. Full Transcript</h3>
<textarea id="output" placeholder="तुमचा मजकूर येथे दिसेल..."></textarea>
<button id="copy">Copy Text</button>
<button id="txt">Download TXT</button>
<button id="srt">Download SRT</button>
<button id="clear">Clear Text</button>
</div>

<p class="small">
पहिल्या वापरात AI Models डाउनलोड होतील. इंटरनेट सुरू ठेवा.
मोठे भाषांतर मॉडेल डाउनलोड होण्यासाठी वेळ आणि फोनमध्ये जागा लागू शकते.
</p>
</div>

<script type="module">
import { pipeline, env } from
'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

env.allowLocalModels = false;
env.useBrowserCache = true;

const videoInput = document.getElementById('video');
const startBtn = document.getElementById('start');
const statusBox = document.getElementById('status');
const outputBox = document.getElementById('output');

let transcriber = null;
let translator = null;
let subtitles = [];

function status(message) {
  statusBox.textContent = message;
}

function formatTime(seconds) {
  seconds = Math.max(0, seconds || 0);
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.floor((seconds % 1) * 1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
}

function downloadFile(name, content, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

async function loadWhisper() {
  if (!transcriber) {
    status('Hindi/English Speech AI Model डाउनलोड होत आहे...');
    transcriber = await pipeline(
      'automatic-speech-recognition',
      'Xenova/whisper-tiny',
      {
        progress_callback: p => {
          if (p.status) status('Speech Model: ' + p.status);
        }
      }
    );
  }
}

async function loadTranslator() {
  if (!translator) {
    status('Hindi Translation Model डाउनलोड होत आहे. पहिल्यांदा वेळ लागू शकतो...');
    translator = await pipeline(
      'translation',
      'Xenova/nllb-200-distilled-600M',
      {
        progress_callback: p => {
          if (p.status) status('Translation Model: ' + p.status);
        }
      }
    );
  }
}

function resample(input, oldRate, newRate) {
  if (oldRate === newRate) return input;
  const ratio = oldRate / newRate;
  const length = Math.floor(input.length / ratio);
  const result = new Float32Array(length);

  for (let i = 0; i < length; i++) {
    const pos = i * ratio;
    const left = Math.floor(pos);
    const right = Math.min(left + 1, input.length - 1);
    const fraction = pos - left;
    result[i] = input[left] * (1 - fraction) +
                input[right] * fraction;
  }
  return result;
}

async function getAudio(file) {
  status('व्हिडिओमधून Audio काढत आहे...');
  const buffer = await file.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const context = new AudioCtx();

  const decoded = await context.decodeAudioData(buffer);
  const channels = decoded.numberOfChannels;
  const mono = new Float32Array(decoded.length);

  for (let c = 0; c < channels; c++) {
    const channel = decoded.getChannelData(c);
    for (let i = 0; i < decoded.length; i++) {
      mono[i] += channel[i] / channels;
    }
  }

  const audio = resample(mono, decoded.sampleRate, 16000);
  await context.close();
  return audio;
}

function splitText(text, maxLength = 350) {
  const sentences = text.match(/[^.!?।]+[.!?।]?/g) || [text];
  const parts = [];
  let current = '';

  for (const sentence of sentences) {
    if ((current + ' ' + sentence).length > maxLength && current) {
      parts.push(current.trim());
      current = sentence;
    } else {
      current += ' ' + sentence;
    }
  }
  if (current.trim()) parts.push(current.trim());
  return parts;
}

async function translateHindi(text) {
  await loadTranslator();
  const parts = splitText(text);
  const translated = [];

  for (let i = 0; i < parts.length; i++) {
    status(`हिंदी भाषांतर सुरू आहे... ${i + 1}/${parts.length}`);
    const result = await translator(parts[i], {
      src_lang: 'eng_Latn',
      tgt_lang: 'hin_Deva'
    });
    translated.push(result[0].translation_text);
  }

  return translated.join(' ');
}

startBtn.addEventListener('click', async () => {
  const file = videoInput.files[0];
  if (!file) {
    alert('आधी Video निवडा.');
    return;
  }

  startBtn.disabled = true;
  outputBox.value = '';
  subtitles = [];

  try {
    const mode = document.querySelector('input[name="mode"]:checked').value;

    await loadWhisper();
    const audio = await getAudio(file);

    status('Audio चे लिखाण तयार होत आहे...');

    const result = await transcriber(audio, {
      language: mode === 'hindi' ? 'hindi' : 'english',
      task: 'transcribe',
      return_timestamps: true,
      chunk_length_s: 30,
      stride_length_s: 5
    });

    let chunks = result.chunks || [];
    let fullText = result.text || '';

    if (mode === 'translate') {
      if (!fullText.trim()) throw new Error('आवाजातून मजकूर मिळाला नाही.');
      fullText = await translateHindi(fullText);

      if (chunks.length) {
        const translatedChunks = [];
        for (let i = 0; i < chunks.length; i++) {
          status(`Subtitle भाषांतर... ${i + 1}/${chunks.length}`);
          const translated = await translateHindi(chunks[i].text);
          translatedChunks.push({
            text: translated,
            timestamp: chunks[i].timestamp
          });
        }
        chunks = translatedChunks;
      }
    }

    outputBox.value = fullText.trim();

    subtitles = chunks.map((chunk, i) => {
      const times = chunk.timestamp || [i * 5, (i + 1) * 5];
      return {
        start: times[0] ?? 0,
        end: times[1] ?? ((times[0] ?? 0) + 5),
        text: chunk.text.trim()
      };
    });

    status('✅ Conversion Completed!');
  } catch (error) {
    console.error(error);
    status('Error: ' + (error.message || error) +
      '\nइंटरनेट तपासा किंवा छोटा व्हिडिओ वापरून पाहा.');
  } finally {
    startBtn.disabled = false;
  }
});

document.getElementById('copy').onclick = async () => {
  if (!outputBox.value) return alert('मजकूर उपलब्ध नाही.');
  await navigator.clipboard.writeText(outputBox.value);
  alert('Text Copy झाला!');
};

document.getElementById('txt').onclick = () => {
  if (!outputBox.value) return alert('मजकूर उपलब्ध नाही.');
  downloadFile('transcript.txt', outputBox.value, 'text/plain;charset=utf-8');
};

document.getElementById('srt').onclick = () => {
  if (!subtitles.length) return alert('Subtitle timestamps उपलब्ध नाहीत.');
  const content = subtitles.map((item, i) =>
    `${i + 1}\n${formatTime(item.start)} --> ${formatTime(item.end)}\n${item.text}`
  ).join('\n\n');
  downloadFile('subtitles.srt', content, 'text/plain;charset=utf-8');
};

document.getElementById('clear').onclick = () => {
  outputBox.value = '';
  subtitles = [];
  status('मजकूर साफ केला.');
};
</script>
</body>
</html>
